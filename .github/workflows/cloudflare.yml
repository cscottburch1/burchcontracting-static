name: Deploy to Cloudflare

# Serves the site's pages from Cloudflare so crawlers never reach Hostinger's
# server-level rate limit. See burchcontracting-dev/CLOUDFLARE-CUTOVER.md.
#
# Every branch, main included, uploads a version and verifies it at its
# preview URL first. Only main promotes, and only after those checks pass:
#
#   1. `wrangler versions upload`  -> a preview URL, no production traffic
#   2. verify-deployment.sh preview -> byte-for-byte against the built dist
#   3. `wrangler versions deploy`  -> promote (main only, only if 2 passed)
#   4. verify-deployment.sh production
#
# Step 2 is the gate. It exists because a deploy can report success, and serve
# the right version.txt, while every HTML asset stays stale — which happened on
# 2026-09-16 and put `noindex` on the live site. A version that fails step 2 is
# simply never promoted, so production keeps serving the last good one.
#
# deploy.yml (Hostinger FTP) keeps running on its own: Hostinger stays a
# complete fallback copy. The contact form and leads admin run in the Worker
# (cloudflare/api.js, D1).
#
# Until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist, every
# run skips with a notice instead of failing.

on:
  push:
    paths:
      - 'burchcontracting-dev/**'
      - '.github/workflows/cloudflare.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: burchcontracting-dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet, so nothing was deployed. See CLOUDFLARE-CUTOVER.md, step 1."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 requires Node.js 22 or newer.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: burchcontracting-dev/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build project
        if: steps.creds.outputs.ready == 'true'
        env:
          BUILD_ENV: production
        run: npm run build

      - name: Build guard (check-build)
        if: steps.creds.outputs.ready == 'true'
        env:
          BUILD_ENV: production
        run: npm run check-build

      - name: Stamp build version
        if: steps.creds.outputs.ready == 'true'
        run: |
          echo "commit=${GITHUB_SHA}" > dist/version.txt
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/version.txt

      # Nothing here can change what production serves. main included: a
      # version is uploaded and verified first, and only promoted afterwards.
      - name: Upload version (production untouched)
        if: steps.creds.outputs.ready == 'true'
        id: upload
        run: |
          set -o pipefail
          # This repository is public: strip any account email Wrangler prints
          # before it reaches the log. (GitHub already masks secret values.)
          redact() { sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[redacted email]/g'; }

          # A real "routes" key — not the word inside a comment — means the
          # Worker is attached to the production domain.
          has_routes=false
          if grep -qE '^[[:space:]]*"routes"[[:space:]]*:' wrangler.jsonc; then has_routes=true; fi

          if npx wrangler deployments list > deployments.log 2>&1; then
            npx wrangler versions upload --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" 2>&1 | redact | tee wrangler.log
          elif [ "$has_routes" = false ]; then
            # Preview versions need an existing Worker. Before cutover there
            # are no routes, so a first deploy only reaches workers.dev.
            echo "Deployments lookup failed (normal when the Worker doesn't exist yet) — its output:"
            tail -5 deployments.log | redact
            echo "::notice::First deploy: creating the Worker on workers.dev (no routes, production unaffected)."
            npx wrangler deploy 2>&1 | redact | tee wrangler.log
            echo "first_deploy=true" >> "$GITHUB_OUTPUT"
          else
            tail -20 deployments.log | redact
            echo "::error::Can't list the Worker's deployments and wrangler.jsonc has routes — refusing to touch production."
            exit 1
          fi

          # `wrangler versions upload` prints, verbatim:
          #   Worker Version ID: <uuid>
          #   Version Preview URL: https://<prefix>-<worker>.<subdomain>.workers.dev
          version_id=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' wrangler.log | tail -1 | awk '{print $NF}')
          url=$(grep -oE 'Version Preview URL: https://[a-zA-Z0-9.-]+' wrangler.log | tail -1 | awk '{print $NF}')

          # The first-deploy branch above used `wrangler deploy`, which prints
          # neither line — it only reaches workers.dev, so verify that instead.
          if [ -z "$url" ]; then
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler.log | tail -1 || true)
          fi
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL — check that workers_dev and preview_urls are true in wrangler.jsonc."
            exit 1
          fi

          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Uploaded version $version_id, previewing at $url"

      # The gate. A version that fails here is never promoted, so a bad build
      # or a partial asset upload cannot reach the live domain.
      - name: Verify the uploaded version
        if: steps.creds.outputs.ready == 'true'
        run: bash ../.github/scripts/verify-deployment.sh "${{ steps.upload.outputs.url }}" preview

      # Only reached when the checks above passed. `versions deploy` shifts all
      # production traffic to the version that was just verified.
      - name: Promote to production (main only)
        if: |
          steps.creds.outputs.ready == 'true'
          && github.ref == 'refs/heads/main'
          && steps.upload.outputs.version_id != ''
          && steps.upload.outputs.first_deploy != 'true'
        id: promote
        run: |
          set -o pipefail
          npx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100" --yes --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          echo "::notice::Promoted ${{ steps.upload.outputs.version_id }} to production"

      # Production serves the same bytes the preview URL did, plus the two
      # checks that only exist on the real domain.
      - name: Verify production (main only)
        if: steps.promote.outcome == 'success'
        run: bash ../.github/scripts/verify-deployment.sh "https://burchcontracting.com" production

      # Runs only after the checks above pass, and only for production. Bing,
      # Yandex, Seznam and Naver then re-crawl the submitted URLs within
      # minutes; Bing's index is what Copilot and ChatGPT search read from.
      # A search engine being slow or rejecting the call shouldn't mark a good
      # deploy as failed, so this step warns instead of failing.
      - name: Tell IndexNow to re-crawl
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs

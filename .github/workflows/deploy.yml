name: Deploy

# The only thing that deploys this site. Everything else — CI, local builds —
# stops at "green". See docs/RUNBOOK.md.
#
# THE PUSH TRIGGER IS COMMENTED OUT ON PURPOSE. Read this before enabling it.
#
# Deploy-on-push was disabled on 2026-09-16 after a Cloudflare-side Git
# integration deployed on every push, built without the indexing flag the model
# then required, and carried none of the `wrangler secret put` secrets. Every
# push shipped noindex on all 70 pages and wiped ADMIN_USERNAME,
# ADMIN_PASSWORD_HASH, SESSION_SECRET, RESEND_API_KEY and RECAPTCHA_SECRET_KEY,
# taking down admin login and lead emails and silently disabling the reCAPTCHA
# check while the form kept accepting submissions.
#
# The post-deploy verification and automatic rollback below are the answer to
# that incident, and they are what would make a push trigger safe. But they
# have never run. Enabling push here would mean the first exercise of an
# unproven deploy path is a real deploy of whatever just merged.
#
# TO ENABLE, in this order:
#   1. Run this workflow once with workflow_dispatch and let it finish green.
#   2. Confirm `wrangler secret list` still returns all five names and that
#      live pages say "index, follow".
#   3. Uncomment the two `push:` lines below.
#
# Do NOT connect the Cloudflare dashboard Git integration instead
# (Workers & Pages -> the Worker -> Builds). That is the thing that caused the
# outage. scripts/check-wrangler-config.mjs fails the build if a `build` block
# appears in wrangler.jsonc, which is how that integration configures itself,
# but the dashboard setting itself is invisible from here.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

# cancel-in-progress is false, deliberately. Cancelling a deploy mid-flight is
# how you get a half-updated Worker with no way to tell which half.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://burchcontracting.com
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: content dates are derived from git at build time.
          # A shallow checkout would stamp today on all 70 sitemap URLs.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # One source for the Node version: .nvmrc, which crawler-access.yml
          # already reads. A hardcoded 22 here would be a second place to update.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run every gate
        run: npm test

      # Two stamps, for two different questions.
      #
      # dist/version.txt answers "did the deploy land at all". Every page gets
      # an HTML comment as well, which answers "is THIS page the new build" —
      # a question the whole-site check below could not ask, and needed to.
      # Nine of seventy-one pages mismatched on run 35743001349 and the log
      # could not say whether that was propagation lag or a Cloudflare
      # transform, because it only printed "mismatch".
      #
      # Deploy-time only: it is appended to dist/, never produced by
      # `npm run build`, so local builds, the gates and the snapshot are
      # untouched. It is an HTML comment, so it is not visible text, not a
      # link, not schema, and not in any field the snapshot compares.
      - name: Stamp build version
        run: |
          echo "commit=${GITHUB_SHA}" > dist/version.txt
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/version.txt

          stamped=0
          while IFS= read -r -d '' f; do
            echo "<!-- build:$GITHUB_SHA -->" >> "$f"
            stamped=$((stamped + 1))
          done < <(find dist -name '*.html' -print0)
          echo "stamped $stamped page(s) with $GITHUB_SHA"

      # `wrangler deploy`, never `versions upload` + `versions deploy`. That was
      # tried on 2026-09-16 and the promoted version came up with NO secrets —
      # all five wiped — despite what `versions upload --help` implies. Plain
      # deploy preserves them.
      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          # This repository is public: strip any account email Wrangler prints.
          redact() { sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[redacted email]/g'; }
          npx wrangler deploy 2>&1 | redact

          # A new Worker version reaches Cloudflare's colos over a few seconds.
          # Verification used to start immediately, and on run 35743001349 the
          # version marker passed (that colo had the new build) while nine page
          # fetches were still answered from colos serving the six-day-old one.
          # This does not replace the per-page retry below; it just stops the
          # common case from needing it.
          echo "settling for 10s before verification"
          sleep 10

      # Everything below is the reason a push trigger could ever be safe here.
      # Any failure falls through to the rollback step.
      - name: Verify deployment
        id: verify
        run: |
          set -euo pipefail

          # 1. Exactly the five expected secrets, no more and no fewer. The
          #    2026-09-16 outage was invisible for hours because nothing
          #    checked this: the Worker ran fine, it just could not send mail,
          #    authenticate an admin, or validate a captcha.
          echo "— secrets"
          actual=$(npx wrangler secret list --format json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const names = JSON.parse(s).map((x) => x.name).sort();
              console.log(names.join(","));
            });')
          expected="ADMIN_PASSWORD_HASH,ADMIN_USERNAME,RECAPTCHA_SECRET_KEY,RESEND_API_KEY,SESSION_SECRET"
          echo "  found:    $actual"
          echo "  expected: $expected"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Worker secrets are $actual, expected exactly $expected"
            exit 1
          fi

          # 2. The new build is the one answering.
          echo "— version marker"
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsSL "$BASE_URL/version.txt?nocache=$GITHUB_RUN_ID-$attempt" | grep '^commit=' | cut -d= -f2 || true)
            [ "$live" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::$BASE_URL serves commit $live, expected $GITHUB_SHA"
            exit 1
          fi
          echo "  serving $live"

          # 3. Five representative pages: one of each kind this site builds.
          #    200, indexable, and pointing at themselves.
          echo "— representative pages"
          for pair in \
            "/|https://burchcontracting.com/" \
            "/services|https://burchcontracting.com/services" \
            "/outdoor-living/decks|https://burchcontracting.com/outdoor-living/decks" \
            "/service-areas/simpsonville|https://burchcontracting.com/service-areas/simpsonville" \
            "/calculator/decks|https://burchcontracting.com/calculator/decks"; do
            path="${pair%%|*}"
            want_canonical="${pair#*|}"
            body=$(curl -fsSL -w '\nHTTP_STATUS:%{http_code}' "$BASE_URL$path?nocache=$GITHUB_RUN_ID")
            status=${body##*HTTP_STATUS:}
            if [ "$status" != "200" ]; then
              echo "::error::$path returned $status"
              exit 1
            fi
            # Bash substring tests, NOT `printf | grep -q`. Under
            # `set -o pipefail`, grep -q exits the instant it matches and closes
            # the pipe; printf is still writing a 90 KB page, takes EPIPE, and
            # the pipeline goes non-zero. The script then reads non-zero as "not
            # found" — so the check failed BECAUSE the string was present, and
            # would have passed on a page that lacked it entirely. Exactly
            # backwards, and it is what happened on this workflow's first real
            # run (2026-09-22, run 35741546873). No pipe here, so there is
            # nothing for pipefail to misread.
            if [[ "$body" != *'name="robots" content="index, follow"'* ]]; then
              echo "::error::$path is not index,follow"
              exit 1
            fi
            if [[ "$body" != *"rel=\"canonical\" href=\"$want_canonical\""* ]]; then
              echo "::error::$path does not carry canonical $want_canonical"
              exit 1
            fi
            echo "  $path 200, index,follow, canonical ok"
          done

          # 3b. Every built page, byte for byte, after normalizing Cloudflare's
          #     email obfuscation. The five probes above check the things a
          #     human would eyeball; this checks that what shipped is what was
          #     built, on all 70 pages. Carried over from the workflow this
          #     replaces — the plan asked only for the representative pages,
          #     but dropping a working whole-site integrity check to satisfy a
          #     spec that did not mention it would be a real loss of coverage.
          #
          #     Each page's URL comes from src/data/url-map.js, not its
          #     filename: guessing from the filename asks for /about.html and
          #     /garage-builder/, which now 301, and for /404.html, which
          #     correctly 404s — failing the job on a curl error, not a
          #     mismatch.
          echo "— whole-site content"
          strip=".github/scripts/strip-cf-email-obfuscation.py"
          work=$(mktemp -d)
          mismatch=0
          retried=0

          while IFS='|' read -r rel url_path; do
            [ -n "$rel" ] || continue

            python3 "$strip" "dist/$rel" > "$work/local.html"
            local_hash=$(sha256sum < "$work/local.html" | cut -d' ' -f1)

            # Fetch, then ask the page which build it is before comparing it.
            # A page still being served from a colo with the previous version
            # is a propagation fact, not a content defect, and retrying is the
            # correct response. Total wait per page is ~60s across six attempts.
            served_stamp=""
            live_hash=""
            for wait in 0 2 4 8 16 30; do
              [ "$wait" -gt 0 ] && { sleep "$wait"; retried=$((retried + 1)); }
              curl -fsSL "$BASE_URL$url_path?nocache=$GITHUB_RUN_ID-$wait" > "$work/served.raw"

              # Parameter expansion, not `grep | head`: see the note on the
              # representative-page checks above.
              raw=$(cat "$work/served.raw")
              served_stamp=""
              if [[ "$raw" == *"<!-- build:"* ]]; then
                after=${raw##*<!-- build:}
                served_stamp=${after%% *}
              fi

              python3 "$strip" "$work/served.raw" > "$work/served.html"
              live_hash=$(sha256sum < "$work/served.html" | cut -d' ' -f1)

              # Done when the page is the new build AND matches. A stale stamp
              # or a hash mismatch both justify another attempt: the second can
              # happen while a colo is mid-swap and the stamp is already new.
              if [ "$served_stamp" = "$GITHUB_SHA" ] && [ "$local_hash" = "$live_hash" ]; then
                break
              fi
            done

            if [ "$local_hash" != "$live_hash" ]; then
              echo "::error::Content mismatch on $url_path (built from $rel)"
              echo "    served stamp: ${served_stamp:-<none found>}"
              echo "    local stamp:  $GITHUB_SHA"
              if [ "$served_stamp" != "$GITHUB_SHA" ]; then
                echo "    the served page is NOT this build — propagation, not content"
              fi
              # diff into a file first. `diff | head` would hand diff an EPIPE
              # under pipefail, which is the bug that broke this step's first
              # version.
              diff "$work/local.html" "$work/served.html" > "$work/diff.txt" 2>&1 || true
              echo "    first 20 lines of diff (local vs served):"
              head -20 "$work/diff.txt" || true
              mismatch=1
            fi
          done < <(node --input-type=module -e '
            import { PAGE_URLS } from "./src/data/url-map.js";
            for (const [file, url] of Object.entries(PAGE_URLS)) console.log(`${file}|${url}`);
          ')
          [ "$mismatch" = "0" ] || exit 1
          echo "  every built page matches what is live (${retried} retry/retries needed)"

          # 4. Same status codes, redirect targets and security headers the
          #    Hostinger site served (migration/routing-baseline.json).
          echo "— routing"
          node scripts/check-routing.mjs "$BASE_URL"

          # 5. Every search and AI crawler gets 200. This is why the site is on
          #    Cloudflare at all.
          echo "— crawler access"
          node scripts/check-crawler-access.mjs "$BASE_URL"

          # 5b. The hostname redirects, which no code in this repo produces.
          #     They are Cloudflare zone settings — "Always Use HTTPS" and a
          #     www -> root Redirect Rule — and if either is switched off,
          #     nothing in a build would notice.
          #
          #     In the 2026-09-22 Search Console export, www drew 19 of the
          #     property's 57 clicks at position 3.25 while the canonical root
          #     drew 12 at position 30.52. A third of all clicks arrive on a
          #     hostname that is supposed to 301. check-routing asserts these
          #     too; they are repeated here because this step is what runs
          #     against production on every deploy.
          echo "— hostname redirects"
          for pair in             "https://www.burchcontracting.com/|https://burchcontracting.com/"             "http://burchcontracting.com/|https://burchcontracting.com/"             "https://www.burchcontracting.com/services?utm_source=deploy|https://burchcontracting.com/services?utm_source=deploy"             "http://burchcontracting.com/services?utm_source=deploy|https://burchcontracting.com/services?utm_source=deploy"; do
            from="${pair%%|*}"
            want="${pair#*|}"
            got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$from")
            echo "  $from -> $got"
            if [ "$got" != "301 $want" ]; then
              echo "::error::$from should 301 to $want in one hop. Check the Cloudflare zone's Always Use HTTPS setting and the www redirect rule."
              exit 1
            fi
          done

          # 6. The API is answered by the Worker, not by a 404 or a 500.
          #    cloudflare/api.js replies 405 to a HEAD on the contact endpoint;
          #    a 404 would mean the route is not reaching api.js at all.
          echo "— api"
          for endpoint in /api/contact /api/contact.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$BASE_URL$endpoint")
            echo "  HEAD $endpoint -> $code"
            if [ "$code" != "405" ]; then
              echo "::error::HEAD $endpoint returned $code, expected 405 from cloudflare/api.js"
              exit 1
            fi
          done

      # Runs only when verification failed. Rolls the Worker back to the
      # previous version, then fails the job loudly — a rolled-back deploy is
      # still a failed deploy and must not show green.
      - name: Roll back
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Post-deploy verification failed. Rolling back."
          npx wrangler rollback --yes --message "Automatic rollback: verification failed for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          echo "Rolled back. Investigate before redeploying — see docs/RUNBOOK.md."
          exit 1

      # Only after everything above passed. Bing, Yandex, Seznam and Naver
      # re-crawl within minutes; Bing's index is what Copilot and ChatGPT
      # search read from. A slow or grumpy search engine should not turn a good
      # deploy red, so this warns instead of failing.
      - name: Tell IndexNow to re-crawl
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs

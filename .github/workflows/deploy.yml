name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy runs at a time. cancel-in-progress is deliberately false:
# cancelling an FTP upload mid-flight is how the server ended up in a mixed
# version state before (stale sync-state file, partially-uploaded files).
# A newly pushed commit queues behind the active run instead of killing it.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: burchcontracting-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: burchcontracting-dev/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # BUILD_ENV=production activates flip-noindex-production.mjs (see
      # package.json's "build" script).
      - name: Build project
        env:
          BUILD_ENV: production
        run: npm run build

      # Fails the workflow (not just a warning) on: &amp;amp; double-encoding,
      # any sitemap URL with zero inbound internal links, or noindex still
      # present anywhere except 404.html. Runs on the regenerated source
      # files from the build step above, not dist/, and before the FTP
      # deploy step so a failure blocks the deploy.
      #
      # Pre-cutover, this used to key off vars.STAGING_URL so the noindex
      # check wouldn't fail every push while deploying to a staging domain
      # (nicheprohub.com) that intentionally carried noindex. Cutover to
      # burchcontracting.com happened (LAUNCH-CHECKLIST.md #7); hardcoded
      # now that the conditional's staging branch is permanently dead —
      # a variable-only toggle to noindex the live site AND disable the
      # guard that catches it was a real footgun.
      - name: Build guard (check-build)
        env:
          BUILD_ENV: production
        run: npm run check-build

      # .well-known/burch-version.txt is a second copy that only Hostinger
      # serves: /.well-known/* is the one path the Worker still forwards there
      # (cloudflare/worker.js), so it proves this FTP deploy landed even though
      # the domain's pages and /api come from Cloudflare.
      - name: Stamp build version
        run: |
          echo "commit=${GITHUB_SHA}" > dist/version.txt
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/version.txt
          mkdir -p dist/.well-known
          cp dist/version.txt dist/.well-known/burch-version.txt

      # Recovery procedure: if the live site is ever stale while runs are
      # green, the FTP action's incremental sync-state file
      # (.ftp-deploy-sync-state.json, in the server-dir root) has likely
      # gotten ahead of what's actually on the server. Delete that file via
      # Hostinger File Manager, then re-run this workflow — with no state
      # file present, the action does a full re-upload of every file.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # Hostinger supports explicit FTPS; if a future run fails at connection, revert this commit while investigating.
          protocol: ftps
          local-dir: ./burchcontracting-dev/dist/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 600000
          # _headers and .assetsignore are Cloudflare-only build files (see
          # cloudflare.yml); Apache would serve them as plain files.
          exclude: |
            **/api/config.local.php
            **/_headers
            **/.assetsignore

      # Since the Cloudflare cutover, burchcontracting.com's pages are served by
      # the Cloudflare Worker, and cloudflare.yml checks every page, redirect
      # and crawler there (including contact.html's reCAPTCHA key, byte for
      # byte), plus the contact form in cloudflare/api.js. Hostinger keeps a
      # full fallback copy of the site, so this step checks the Hostinger side
      # through /.well-known.
      #
      # If the cutover is ever rolled back, revert the cutover commit: that
      # restores the page-by-page content check against Hostinger here.
      - name: Verify deployment
        env:
          SITE_URL: https://burchcontracting.com
        run: |
          sleep 10
          live=$(curl -fsSL --retry 3 "$SITE_URL/.well-known/burch-version.txt?nocache=$GITHUB_RUN_ID" | grep '^commit=' | cut -d= -f2)
          echo "Hostinger commit: $live"
          echo "Expected commit:  $GITHUB_SHA"
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::Hostinger's .well-known/burch-version.txt does not match this commit — the FTP sync likely skipped files. Delete .ftp-deploy-sync-state.json on the server and re-run."
            exit 1
          fi

          # /api/* no longer reaches Hostinger through the domain, so its
          # contact.php and config.local.php can't be checked from here;
          # cloudflare.yml checks the Worker's /api/contact.php instead.

          echo "Deploy verified: Hostinger matches $GITHUB_SHA"
